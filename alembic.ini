# Alembic (database migrations) for the command line. The app itself does not need
# this file: the vision engine runs `upgrade` on start-up (backend/db/migrate.py).
#
#   alembic upgrade head                      apply all migrations to DATABASE_URL
#   alembic current                           which migration the database is at
#   alembic upgrade head --sql                print the SQL instead of running it
#   alembic revision --autogenerate --rev-id 0002 -m "add xyz"
#                                             write a new migration from models.py
#
# The connection comes from DATABASE_URL (or the local SQLite default), exactly as
# the app's: see backend/db/migrations/env.py. Never put a URL in this file.

[alembic]
script_location = %(here)s/backend/db/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
