# Render Blueprint: the live demo, defined as code.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: rubiks-cube-solver
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: FLASK_SECRET_KEY
        generateValue: true
      # Neon connection string (production branch, Connection pooling off). A secret:
      # set it in the dashboard (Environment), never in git. Render ignores sync:false
      # variables when it updates an existing Blueprint, so add it there by hand.
      - key: DATABASE_URL
        sync: false
      # Google AI Studio key for the AI features (Phase 4). Also a secret: add it in the
      # dashboard by hand, like DATABASE_URL. Without it the AI Assistant gives built-in answers.
      - key: GEMINI_API_KEY
        sync: false
