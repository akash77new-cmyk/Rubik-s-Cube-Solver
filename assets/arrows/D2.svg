<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="D2 turn">
  <defs>
    <!-- userSpaceOnUse is required: a straight horizontal/vertical arrow has a
         zero-area bounding box, and an objectBoundingBox gradient on a
         degenerate bbox makes the element disappear entirely. -->
    <linearGradient id="gradA" gradientUnits="userSpaceOnUse"
                    x1="0" y1="0" x2="256" y2="256">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="head-gradA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="faceA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B1B29"/>
      <stop offset="100%" stop-color="#12121C"/>
    </linearGradient>
    <!-- userSpaceOnUse for the same reason as the gradient: the default
         objectBoundingBox filter region collapses to nothing on a straight line. -->
    <filter id="glowA" filterUnits="userSpaceOnUse"
            x="-40" y="-40" width="336" height="336">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- userSpaceOnUse: the default markerUnits scales the head by stroke-width,
         which would blow it up to ~65 units and clip it outside the viewBox. -->
    <marker id="headA" viewBox="0 0 12 12" refX="8.5" refY="6"
            markerWidth="28" markerHeight="28" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M1.5 1 L11 6 L1.5 11 Z" fill="url(#head-gradA)"/>
    </marker>
  </defs>
    <rect x="34" y="34" width="188" height="188" rx="26" fill="url(#faceA)" stroke="#3F3F55" stroke-width="3"/>
    <rect x="46" y="46" width="52" height="52" rx="12" fill="#2A2A3A" fill-opacity="0.55" stroke="#3F3F55" stroke-width="2"/>
    <rect x="108" y="46" width="52" height="52" rx="12" fill="#2A2A3A" fill-opacity="0.55" stroke="#3F3F55" stroke-width="2"/>
    <rect x="170" y="46" width="52" height="52" rx="12" fill="#2A2A3A" fill-opacity="0.55" stroke="#3F3F55" stroke-width="2"/>
    <rect x="46" y="108" width="52" height="52" rx="12" fill="#2A2A3A" fill-opacity="0.55" stroke="#3F3F55" stroke-width="2"/>
    <rect x="108" y="108" width="52" height="52" rx="12" fill="#2A2A3A" fill-opacity="0.55" stroke="#3F3F55" stroke-width="2"/>
    <rect x="170" y="108" width="52" height="52" rx="12" fill="#2A2A3A" fill-opacity="0.55" stroke="#3F3F55" stroke-width="2"/>
    <rect x="46" y="170" width="52" height="52" rx="12" fill="url(#gradA)" fill-opacity="0.92" stroke="#8B5CF6" stroke-width="2"/>
    <rect x="108" y="170" width="52" height="52" rx="12" fill="url(#gradA)" fill-opacity="0.92" stroke="#8B5CF6" stroke-width="2"/>
    <rect x="170" y="170" width="52" height="52" rx="12" fill="url(#gradA)" fill-opacity="0.92" stroke="#8B5CF6" stroke-width="2"/>
    <path d="M56 236 L196 236" fill="none" stroke="url(#gradA)" stroke-width="12" stroke-linecap="round" filter="url(#glowA)" marker-end="url(#headA)" marker-start="url(#headA)"/>
    <g transform="translate(16 8)">
      <rect x="0" y="0" width="62" height="34" rx="12" fill="#8B5CF6" fill-opacity="0.28" stroke="#8B5CF6" stroke-width="2"/>
      <text x="31" y="24" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#E9E7FF">180°</text>
    </g>
</svg>
